; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5atom

[env:m5atom]
platform = espressif32
board = m5stack-atom
framework = arduino
lib_deps =
	m5stack/M5Atom
	fastled/FastLED @ ^3.4.0
	seeed-studio/Grove 4-Digit Display@^1.0.0
lib_ignore = RF24_STM32
#monitor_speed = 115200
monitor_speed = 115200
#upload_speed = 115200
upload_port = COM5
monitor_port = COM5
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = min_spiffs.csv
; ATOM は DIO。未指定だと PlatformIO が QIO 版 SDK をリンクし、esp_flash 経由の読み出し
; （OTA 検証・Update・NVS）がすべて化ける（書き込み・消去は正常）。2026-10-09 実機で確認
board_build.arduino.memory_type = dio_qspi

; OTA用ビルド環境（upload は http://<デバイスIP>/update からブラウザでアップロード）
[env:m5atom-ota]
platform = espressif32
board = m5stack-atom
framework = arduino
lib_deps =
	m5stack/M5Atom
	fastled/FastLED @ ^3.4.0
	seeed-studio/Grove 4-Digit Display@^1.0.0
lib_ignore = RF24_STM32
monitor_speed = 115200
monitor_port = COM5
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = min_spiffs.csv
; ATOM は DIO。未指定だと PlatformIO が QIO 版 SDK をリンクし、esp_flash 経由の読み出し
; （OTA 検証・Update・NVS）がすべて化ける（書き込み・消去は正常）。2026-10-09 実機で確認
board_build.arduino.memory_type = dio_qspi